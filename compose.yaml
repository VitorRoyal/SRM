services:
  postgres:
    image: postgres:17-alpine
    container_name: credit-engine-postgres
    environment:
      POSTGRES_DB: credit_engine
      POSTGRES_USER: credit_engine
      POSTGRES_PASSWORD: credit_engine
    ports:
      - "5434:5432"
    volumes:
      - credit-engine-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_engine -d credit_engine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  credit-engine-postgres-data:
