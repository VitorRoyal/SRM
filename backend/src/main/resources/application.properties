spring.application.name=credit-engine

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/credit_engine}
spring.datasource.username=${DB_USER:credit_engine}
spring.datasource.password=${DB_PASSWORD:credit_engine}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.mvc.problemdetails.enabled=true

credit-engine.business-zone=America/Sao_Paulo

springdoc.swagger-ui.path=/swagger-ui.html
